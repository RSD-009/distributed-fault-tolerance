[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No faults: plain diffuse-v3"

[Config Crash]
description = "Relay node 1 crashes before the INFORM arrives"
extends = Baseline
**.node[1].crashTime = 2ms

[Config MsgLoss]
description = "Random message loss, recovered via retransmission"
extends = Baseline
**.msgLossProb = 0.3

[Config CrashAndLoss]
description = "Crash + message loss together"
extends = Baseline
**.node[1].crashTime = 2ms
**.msgLossProb = 0.2
