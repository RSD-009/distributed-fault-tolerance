[General]
network = Network
sim-time-limit = 10s
**.numNodes = 6
**.heartbeatInterval = 20ms
**.timeout = 50ms

# No faults — sanity check that the baseline heartbeat exchange works.
[Config Baseline]
description = "No faults"

# Student C: once fault injection exists, point its "enabled"/"crashTime"
# parameters here instead of leaving this as a copy of Baseline.
[Config Crash]
description = "Node crash + re-election"
extends = Baseline

[Config Partition]
description = "Network partition"
extends = Baseline

[Config MsgLoss]
description = "Random message loss"
extends = Baseline
