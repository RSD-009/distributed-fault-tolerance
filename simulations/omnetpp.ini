[General]
network = Network
sim-time-limit = 5s
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No faults: plain diffuse-v3"

[Config Crash]
description = "Internal relay node crashes mid-diffusion"
extends = Baseline
**.node[3].crashTime = 0.02s

[Config MsgLoss]
description = "Random message loss, recovered via retransmission"
extends = Baseline
**.msgLossProb = 0.2

[Config CrashAndLoss]
description = "Crash + message loss together"
extends = Baseline
**.node[3].crashTime = 0.02s
**.msgLossProb = 0.2
