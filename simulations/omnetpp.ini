# =====================================================================
# Naming: <Family>_<Fault>_<Mechanism>
#   Node_*  = faults of a node      Link_* = faults of a link
#   Mechanisms: NoRetry (detection only), Retransmit, Checkpoint, Replication
# =====================================================================
[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No fault, no extra mechanism: plain diffuse-v3 + ACK"

# ---------------------------------------------------------------------
# NODE FAULT 1: permanent crash of relay node 1 at 2ms
# ---------------------------------------------------------------------
[Config Node_Crash_Timeout]
description = "Node 1 crashes for good; timeout only DETECTS it"
extends = Baseline
**.node[1].crashTime = 2ms

[Config Node_Crash_Replication]
description = "Same crash, backup links 2-3 and 2-4 (replication)"
extends = Node_Crash_Timeout
**.replication = true

# ---------------------------------------------------------------------
# NODE FAULT 2: crash + reboot (node 1 crashes at 7ms, reboots at 100ms)
# ---------------------------------------------------------------------
[Config Node_Reboot_Cold]
description = "Node 1 reboots with empty memory (no checkpoint)"
extends = Baseline
**.node[1].crashTime = 7ms
**.node[1].recoverTime = 100ms
**.checkpointing = false

[Config Node_Reboot_Checkpoint]
description = "Same reboot, node 1 reloads its checkpoint"
extends = Node_Reboot_Cold
**.checkpointing = true

# ---------------------------------------------------------------------
# NODE FAULT 3: transient (node 1 deaf from 4ms to 70ms, then back)
# ---------------------------------------------------------------------
[Config Node_Transient_Retransmit]
description = "Node 1 deaf 4-70ms; retransmission reaches it after it wakes up"
extends = Baseline
**.node[1].silentStart = 4ms
**.node[1].silentEnd = 70ms

[Config Node_Transient_NoRetry]
description = "Same, but no retransmission: node 0 gives up at 50ms"
extends = Node_Transient_Retransmit
**.maxRetries = 0

# ---------------------------------------------------------------------
# LINK FAULT 1: random message loss (30%)
# ---------------------------------------------------------------------
[Config Link_Loss_Retransmit]
description = "30% message loss, recovered by retransmission"
extends = Baseline
**.msgLossProb = 0.3

[Config Link_Loss_NoRetry]
description = "30% message loss, no retransmission"
extends = Link_Loss_Retransmit
**.maxRetries = 0

# ---------------------------------------------------------------------
# LINK FAULT 2: partition of link 1-3
# ---------------------------------------------------------------------
[Config Link_Partition_Retransmit]
description = "Link 1-3 cut 4-70ms, retransmission recovers after it heals"
extends = Baseline
**.node[1].partitionPeer = 3
**.node[3].partitionPeer = 1
**.node[1].partitionStart = 4ms
**.node[3].partitionStart = 4ms
**.node[1].partitionEnd = 70ms
**.node[3].partitionEnd = 70ms

[Config Link_Partition_NoRetry]
description = "Same short cut, no retransmission: node 3 is lost"
extends = Link_Partition_Retransmit
**.maxRetries = 0

[Config Link_PartitionLong_Retransmit]
description = "Link 1-3 cut 500ms: longer than the retries, false suspicion"
extends = Link_Partition_Retransmit
**.node[1].partitionEnd = 500ms
**.node[3].partitionEnd = 500ms

[Config Link_PartitionLong_Replication]
description = "Same long cut, node 3 also reached through backup link 2-3"
extends = Link_PartitionLong_Retransmit
**.replication = true
