[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No faults: plain diffuse-v3"

[Config Crash]
description = "Relay node 1 crashes before the INFORM arrives"
extends = Baseline
**.node[1].crashTime = 2ms

[Config MsgLoss]
description = "Random message loss, recovered via retransmission"
extends = Baseline
**.msgLossProb = 0.3

[Config CrashAndLoss]
description = "Crash + message loss together"
extends = Baseline
**.node[1].crashTime = 2ms
**.msgLossProb = 0.2

[Config Partition]
description = "Link 1<->3 is cut from 4ms to 70ms, then heals"
extends = Baseline
**.node[1].partitionPeer = 3
**.node[3].partitionPeer = 1
**.node[1].partitionStart = 4ms
**.node[3].partitionStart = 4ms
**.node[1].partitionEnd = 70ms
**.node[3].partitionEnd = 70ms

[Config PartitionLong]
description = "Link 1<->3 is cut for 500ms, longer than the retries"
extends = Partition
**.node[1].partitionEnd = 500ms
**.node[3].partitionEnd = 500ms

[Config Transient]
description = "Node 1 is deaf from 4ms to 70ms, then recovers"
extends = Baseline
**.node[1].silentStart = 4ms
**.node[1].silentEnd = 70ms
