[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No fault"

[Config Node_Crash_Timeout]
description = "Random crash, detect only"
extends = Baseline
**.crashTime = 2ms

[Config Node_Reboot_Cold]
description = "Crash+reboot, no checkpoint"
extends = Baseline
**.crashTime = 7ms
**.recoverTime = 100ms
**.checkpointing = false

[Config Node_Reboot_Checkpoint]
description = "Crash+reboot, with checkpoint"
extends = Node_Reboot_Cold
**.checkpointing = true

[Config Node_Transient_Retransmit]
description = "Transient fault, retransmit"
extends = Baseline
**.silentStart = 4ms
**.silentEnd = 70ms

[Config Node_Transient_NoRetry]
description = "Transient fault, no retry"
extends = Node_Transient_Retransmit
**.maxRetries = 0

[Config Link_Loss_Retransmit]
description = "Random link gone, retransmit"
extends = Baseline
**.partitionStart = 0s
**.partitionEnd = 5s

[Config Link_Partition_Retransmit]
description = "Short partition, retransmit"
extends = Baseline
**.partitionStart = 4ms
**.partitionEnd = 70ms

[Config Link_Partition_NoRetry]
description = "Short partition, no retry"
extends = Link_Partition_Retransmit
**.maxRetries = 0

[Config Link_PartitionLong_Retransmit]
description = "Long partition, retransmit only"
extends = Link_Partition_Retransmit
**.partitionEnd = 500ms

[Config Link_PrimaryCut_NoMechanism]
description = "Permanent cut, no backup"
extends = Baseline
**.partitionNodeId = 3
**.partitionParentId = 1
**.partitionStart = 0s
**.partitionEnd = 5s

[Config Link_PrimaryCut_Replication]
description = "Permanent cut, with backup"
extends = Link_PrimaryCut_NoMechanism
**.replication = true

[Config Ring_Baseline]
description = "Ring topology, no fault"
network = Ring
extends = Baseline

[Config Ring_Node_Crash_Timeout]
description = "Ring topology, random crash"
network = Ring
extends = Node_Crash_Timeout

[Config Star_Baseline]
description = "Star topology, no fault"
network = Star
extends = Baseline

[Config Star_Node_Crash_Timeout]
description = "Star topology, random crash"
network = Star
extends = Node_Crash_Timeout

[Config Mesh_Baseline]
description = "Mesh backbone, no fault"
network = Mesh
extends = Baseline
**.numNodes = 11

[Config Mesh_Node_Crash_Timeout]
description = "Mesh backbone, random crash"
network = Mesh
extends = Node_Crash_Timeout
**.numNodes = 11
