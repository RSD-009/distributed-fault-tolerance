[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No fault, no extra mechanism: plain diffuse-v3 + ACK, random initiator"

[Config Node_Crash_Timeout]
description = "A random node crashes for good; timeout only DETECTS it"
extends = Baseline
**.crashTime = 2ms

[Config Node_Reboot_Cold]
description = "The crash target reboots with empty memory (no checkpoint)"
extends = Baseline
**.crashTime = 7ms
**.recoverTime = 100ms
**.checkpointing = false

[Config Node_Reboot_Checkpoint]
description = "Same reboot, the node reloads its checkpoint"
extends = Node_Reboot_Cold
**.checkpointing = true

[Config Node_Transient_Retransmit]
description = "A random node is deaf 4-70ms; retransmission reaches it after it wakes up"
extends = Baseline
**.silentStart = 4ms
**.silentEnd = 70ms

[Config Node_Transient_NoRetry]
description = "Same, but no retransmission: the sender gives up at 50ms"
extends = Node_Transient_Retransmit
**.maxRetries = 0

[Config Link_Loss_Retransmit]
description = "30% message loss, recovered by retransmission"
extends = Baseline
**.msgLossProb = 0.3

[Config Link_Loss_NoRetry]
description = "30% message loss, no retransmission"
extends = Link_Loss_Retransmit
**.maxRetries = 0

[Config Link_Loss_Replication]
description = "30% message loss, backed by replication instead of relying on retransmission alone"
extends = Link_Loss_Retransmit
**.replication = true

[Config Link_Partition_Retransmit]
description = "A random edge is cut 4-70ms, retransmission recovers after it heals"
extends = Baseline
**.partitionStart = 4ms
**.partitionEnd = 70ms

[Config Link_Partition_NoRetry]
description = "Same short cut, no retransmission: the far side is lost"
extends = Link_Partition_Retransmit
**.maxRetries = 0

[Config Link_PartitionLong_Retransmit]
description = "Same edge cut 500ms: longer than the retries, false suspicion"
extends = Link_Partition_Retransmit
**.partitionEnd = 500ms

[Config Link_PartitionLong_Replication]
description = "Same long cut, backed by replication links instead"
extends = Link_PartitionLong_Retransmit
**.replication = true

[Config Ring_Baseline]
description = "diffuse-v3 on a ring topology, no fault"
network = Ring
extends = Baseline

[Config Ring_Node_Crash_Timeout]
description = "A random node crashes on a ring"
network = Ring
extends = Node_Crash_Timeout

[Config Star_Baseline]
description = "diffuse-v3 on a star topology, no fault"
network = Star
extends = Baseline

[Config Star_Node_Crash_Timeout]
description = "A random node crashes on a star (could be the hub itself)"
network = Star
extends = Node_Crash_Timeout
