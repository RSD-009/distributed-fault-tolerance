[General]
network = Network
sim-time-limit = 5s
repeat = 10
**.numNodes = 7
**.timeout = 50ms
**.maxRetries = 3

[Config Baseline]
description = "No fault"

[Config Node_Crash_Timeout]
description = "Random crash, detect only"
extends = Baseline
**.crashTime = 2ms

[Config Node_Reboot_Cold]
description = "Crash+reboot, no checkpoint"
extends = Baseline
**.crashTime = 7ms
**.recoverTime = 100ms
**.checkpointing = false

[Config Node_Reboot_Checkpoint]
description = "Crash+reboot, with checkpoint"
extends = Node_Reboot_Cold
**.checkpointing = true

[Config Node_Transient_Retransmit]
description = "Transient fault, retransmit"
extends = Baseline
**.silentStart = 4ms
**.silentEnd = 70ms

[Config Node_Transient_NoRetry]
description = "Transient fault, no retry"
extends = Node_Transient_Retransmit
**.maxRetries = 0

[Config Link_MsgLoss_Retransmit]
description = "Message lost in transit, retransmit"
extends = Baseline
**.msgLossProb = 0.3

[Config Link_Down_Retransmit]
description = "Link permanently down, retransmit only"
extends = Baseline
**.partitionStart = 0s
**.partitionEnd = 5s

[Config Link_Down_Replication]
description = "Link permanently down, with backup"
extends = Link_Down_Retransmit
**.replication = true

[Config Ring_Baseline]
description = "Ring topology, no fault"
network = Ring
extends = Baseline

[Config Ring_Node_Crash_Timeout]
description = "Ring topology, random crash"
network = Ring
extends = Node_Crash_Timeout

[Config Star_Baseline]
description = "Star topology, no fault"
network = Star
extends = Baseline

[Config Star_Node_Crash_Timeout]
description = "Star topology, random crash"
network = Star
extends = Node_Crash_Timeout

[Config Mesh_Baseline]
description = "Mesh backbone, no fault"
network = Mesh
extends = Baseline
**.numNodes = 11

[Config Mesh_Node_Crash_Timeout]
description = "Mesh backbone, random crash"
network = Mesh
extends = Node_Crash_Timeout
**.numNodes = 11
